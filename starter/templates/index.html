<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="page-header">
    <h1>Sudoku Game</h1>
    <button id="theme-toggle" type="button" aria-pressed="false">Dark Mode</button>
  </header>
  
  <div class="difficulty-selector">
    <label for="difficulty">Difficulty:</label>
    <select id="difficulty">
      <option value="easy">Easy (45 clues)</option>
      <option value="medium" selected>Medium (35 clues)</option>
      <option value="hard">Hard (25 clues)</option>
    </select>
  </div>
  
  <div id="sudoku-board"></div>
  <div class="controls">
    <button id="new-game">New Game</button>
    <button id="hint">Hint</button>
    <button id="check-solution">Check Solution</button>
    <span id="timer">Time: 00:00</span>
    <span id="hint-count">Hints Used: 0</span>
    <span id="message"></span>
  </div>
  
  <div id="leaderboard-section" class="leaderboard-section">
    <h2>Top 10 Leaderboard</h2>
    <table id="leaderboard" class="leaderboard-table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Player</th>
          <th>Time</th>
          <th>Difficulty</th>
          <th>Hints</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="5">No scores yet</td></tr>
      </tbody>
    </table>
    <button id="clear-leaderboard">Clear Leaderboard</button>
  </div>
  
  <!-- Player name modal -->
  <div id="name-modal" class="modal">
    <div class="modal-content">
      <h2>Congratulations!</h2>
      <p>You solved it in <span id="modal-time">00:00</span> with <span id="modal-hints">0</span> hints on <span id="modal-difficulty">medium</span>!</p>
      <p>Enter your name for the leaderboard:</p>
      <input type="text" id="player-name" placeholder="Your name" maxlength="20">
      <div class="modal-buttons">
        <button id="submit-name">Save Score</button>
        <button id="skip-name">Skip</button>
      </div>
    </div>
  </div>
  
  <script src="/static/main.js"></script>
</body>
</html>
